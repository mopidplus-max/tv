<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>SIMPLE — вход в панель</title>
  <link rel="icon" href="{{ url_for('public.favicon') }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
</head>
<body class="login-body">
  <div class="login-bg" aria-hidden="true">
    <span class="orb orb-a"></span>
    <span class="orb orb-b"></span>
    <span class="grid-glow"></span>
  </div>
  <main class="login-card">
    <div class="login-brand">
      <span class="brand-mark">S</span>
      <div><strong>SIMPLE</strong><small>IPTV CONTROL</small></div>
    </div>
    <h1>Вход в панель</h1>
    <p class="muted">Управление эфиром, контентом и расписанием канала.</p>
    {% if error %}
      <div class="flash flash-error"><svg class="icon"><use href="#i-warning"/></svg><span>{{ error }}</span></div>
    {% endif %}
    <form method="post" action="{{ url_for('admin.login', next=next_url) }}" class="stack-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <input type="hidden" name="next" value="{{ next_url }}">
      <label class="field">
        <span>Логин</span>
        <input type="text" name="username" autocomplete="username" required autofocus spellcheck="false">
      </label>
      <label class="field">
        <span>Пароль</span>
        <div class="password-wrap">
          <input type="password" name="password" autocomplete="current-password" required>
          <button type="button" class="icon-btn" data-toggle-password aria-label="Показать пароль">
            <svg class="icon"><use href="#i-eye"/></svg>
          </button>
        </div>
      </label>
      <button class="btn btn-primary btn-block" type="submit">Войти в эфирную</button>
    </form>
    <div class="login-foot">
      <span class="dot dot-live"></span>
      Локальный сервер · 127.0.0.1
    </div>
  </main>
  <svg class="svg-sprite" aria-hidden="true">
    <symbol id="i-warning" viewBox="0 0 24 24"><path d="M12 2 1 21h22zm0 4.3L19.6 19H4.4zM11 9h2v6h-2zm0 8h2v2h-2z"/></symbol>
    <symbol id="i-eye" viewBox="0 0 24 24"><path d="M12 5c5.5 0 9.5 5.5 9.5 7s-4 7-9.5 7-9.5-5.5-9.5-7S6.5 5 12 5zm0 2c-3.8 0-6.7 3.4-7.4 5 .7 1.6 3.6 5 7.4 5s6.7-3.4 7.4-5c-.7-1.6-3.6-5-7.4-5zm0 2a3 3 0 1 1 0 6 3 3 0 0 1 0-6z"/></symbol>
  </svg>
  <script src="{{ url_for('static', filename='js/admin.js') }}"></script>
</body>
</html>
